services:
  - type: web
    name: outfish-makanu-sync
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: MAKANU_BASE_URL
        value: https://b2b.makanu.pl
      - key: MAKANU_START_PATH
        value: /pulpit
      - key: BRIDGE_API_KEY
        sync: false
